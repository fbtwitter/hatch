// Compose stability configuration. Comments are // — the parser rejects #.
//
// These types live in mobile/shared, which ADR-0006 keeps free of platform and framework
// dependencies, so they cannot carry @Immutable and the Compose compiler has to infer their
// stability across a module boundary. It cannot, and `tags: List<String>` is an interface
// type it treats as unstable regardless. The result is that every visible task row
// recomposes whenever any part of the screen state changes — exactly the work that makes a
// list feel sticky while scrolling.
//
// Declaring them stable is a promise the code already keeps: they are immutable data classes
// and every edit produces a new instance via copy(), never an in-place mutation.
dev.hatch.sync.TodoItem
dev.hatch.sync.TaskList
dev.hatch.sync.TasksFile

// Compose treats a `List` parameter as unstable even when its element type is stable
// ("the Compose compiler always marks a parameter of type List as unstable, even when it is a
// collection of stable types" — developer.android.com/develop/ui/compose/performance/stability/fix).
// Declaring TodoItem stable above therefore only made TaskRow(task) skippable; every screen
// takes tasks: List<TodoItem> / lists: List<TaskList>, so all of them stayed non-skippable, and
// the composable lambdas holding the four pager pages captured those lists and so were never
// memoised either.
//
// This line is an unenforced, codebase-wide promise: any list handed to a composable must be
// treated as immutable. The code already keeps it — state flows through copy()/map()/filter and
// persist() is the sole mutation path — and nothing will fail if that stops being true. See
// docs/adr/0008-kotlin-collections-declared-stable.md for the alternatives that were rejected.
kotlin.collections.*
