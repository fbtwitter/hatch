name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-and-release:
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Generate placeholder assets
        shell: pwsh
        run: .\scripts\create-assets.ps1

      - name: Set MSIX version from tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $parts = $tag.TrimStart('v').Split('.')
          while ($parts.Count -lt 4) { $parts += '0' }
          $msixVer = ($parts[0..3]) -join '.'
          (Get-Content Package.appxmanifest -Raw) `
            -creplace 'Version="[\d\.]+"', "Version=""$msixVer""" |
            Set-Content Package.appxmanifest -Encoding utf8NoBOM
          "MSIX_VERSION=$msixVer" | Out-File $env:GITHUB_ENV -Append

      - name: Decode signing certificate
        shell: pwsh
        run: |
          $pfxBytes = [Convert]::FromBase64String("${{ secrets.SIGNING_CERTIFICATE }}")
          [IO.File]::WriteAllBytes("${{ github.workspace }}\signing.pfx", $pfxBytes)
          $cert = Import-PfxCertificate `
            -FilePath "${{ github.workspace }}\signing.pfx" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -Password (ConvertTo-SecureString "${{ secrets.CERTIFICATE_PASSWORD }}" -AsPlainText -Force)
          [IO.File]::WriteAllBytes(
            "${{ github.workspace }}\install-cert.cer",
            $cert.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert)
          )
          "CERT_THUMBPRINT=$($cert.Thumbprint)" | Out-File $env:GITHUB_ENV -Append
          Write-Host "Certificate thumbprint: $($cert.Thumbprint)"

      - name: Restore dependencies
        shell: pwsh
        run: msbuild todo-winui3.csproj /t:Restore /p:Configuration=Release /nowarn:NETSDK1233

      - name: Build x64 MSIX
        shell: pwsh
        run: |
          msbuild todo-winui3.csproj `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:AppxPackageDir="${{ github.workspace }}\AppxPackages\" `
            /p:AppxPackageSigningEnabled=true `
            /p:PackageCertificateThumbprint="${{ env.CERT_THUMBPRINT }}" `
            /nowarn:NETSDK1233
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build x86 MSIX
        continue-on-error: true
        shell: pwsh
        run: |
          msbuild todo-winui3.csproj `
            /p:Configuration=Release `
            /p:Platform=x86 `
            /p:AppxPackageDir="${{ github.workspace }}\AppxPackages\" `
            /p:AppxPackageSigningEnabled=true `
            /p:PackageCertificateThumbprint="${{ env.CERT_THUMBPRINT }}" `
            /nowarn:NETSDK1233
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build arm64 MSIX
        shell: pwsh
        run: |
          msbuild todo-winui3.csproj `
            /p:Configuration=Release `
            /p:Platform=arm64 `
            /p:AppxPackageDir="${{ github.workspace }}\AppxPackages\" `
            /p:AppxPackageSigningEnabled=true `
            /p:PackageCertificateThumbprint="${{ env.CERT_THUMBPRINT }}" `
            /nowarn:NETSDK1233
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Collect MSIX files and create bundle
        shell: pwsh
        run: |
          # Find the Windows SDK MakeAppx.exe
          $makeAppx = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" `
            -Filter "MakeAppx.exe" -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "x64" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $makeAppx) { Write-Error "MakeAppx.exe not found"; exit 1 }
          Write-Host "Using MakeAppx: $($makeAppx.FullName)"

          # Collect MSIX files (they live inside per-arch subdirectories)
          $msixFiles = Get-ChildItem -Recurse -Filter "*.msix" -Path AppxPackages |
            Where-Object { $_.FullName -notmatch "\\Dependencies\\" }

          Write-Host "Found MSIX files:"
          $msixFiles | ForEach-Object { Write-Host "  $($_.FullName)" }

          if ($msixFiles.Count -eq 0) { Write-Error "No MSIX files found"; exit 1 }

          # Copy them flat into a staging folder so MakeAppx /d can find them
          $stagingDir = "${{ github.workspace }}\BundleStaging"
          New-Item -ItemType Directory -Path $stagingDir -Force | Out-Null
          $msixFiles | ForEach-Object { Copy-Item $_.FullName -Destination $stagingDir }

          # Export per-arch env vars for the release notes
          $msixFiles | ForEach-Object {
            if ($_.Name -match "_x64_") {
              "X64_MSIX_NAME=$($_.Name)" | Out-File $env:GITHUB_ENV -Append
            } elseif ($_.Name -match "_x86_") {
              "X86_MSIX_NAME=$($_.Name)" | Out-File $env:GITHUB_ENV -Append
            } elseif ($_.Name -match "_arm64_") {
              "ARM64_MSIX_NAME=$($_.Name)" | Out-File $env:GITHUB_ENV -Append
            }
          }

          # Create the bundle
          $bundleName = "Hatch_${{ env.MSIX_VERSION }}_bundle.msixbundle"
          $bundlePath = "${{ github.workspace }}\$bundleName"
          & $makeAppx.FullName bundle /d $stagingDir /p $bundlePath /overwrite
          if ($LASTEXITCODE -ne 0) { Write-Error "MakeAppx bundle failed"; exit $LASTEXITCODE }

          "BUNDLE_PATH=$bundlePath" | Out-File $env:GITHUB_ENV -Append
          "BUNDLE_NAME=$bundleName" | Out-File $env:GITHUB_ENV -Append
          Write-Host "Bundle created: $bundlePath"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Hatch ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## Installation

            **First time only — install the signing certificate so Windows trusts the package:**
            1. Download `install-cert.cer`
            2. Double-click it → **Install Certificate** → **Local Machine** → **Trusted People** → Finish

            **Install the app:**
            - **Recommended:** Download `${{ env.BUNDLE_NAME }}` — Windows picks the right architecture automatically
            - Or choose your platform manually:
              - **Intel/AMD 64-bit:** `${{ env.X64_MSIX_NAME }}`
              - **Intel/AMD 32-bit:** `${{ env.X86_MSIX_NAME }}`
              - **ARM 64-bit:** `${{ env.ARM64_MSIX_NAME }}`
            - Double-click the downloaded file to install

            > Subsequent updates from this repo won't need the certificate step again.
          files: |
            install-cert.cer
            ${{ env.BUNDLE_PATH }}
            AppxPackages/*/todo-winui3*.msix
