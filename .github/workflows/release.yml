name: Release

on:
  push:
    tags:
      - "v*.*.*"
  # Dry run: builds and signs exactly as a tagged release would, but publishes nothing.
  # Without this the only way to exercise the release path — and the injected secrets — is
  # to cut a real public release.
  workflow_dispatch:
    inputs:
      version:
        description: "Version for the dry-run build (no release is published)"
        required: false
        default: "0.0.0"

jobs:
  build-and-release:
    runs-on: windows-2022
    permissions:
      contents: write

    # The WinUI app lives in windows/; every run step keeps its original relative paths.
    # Steps using ${{ github.workspace }} stay repo-root-relative and are unaffected.
    defaults:
      run:
        working-directory: windows

    steps:
      - uses: actions/checkout@v4

      - name: Inject secrets
        shell: pwsh
        run: |
          $url = "${{ secrets.SUPABASE_URL }}"
          $key = "${{ secrets.SUPABASE_KEY }}"

          # A malformed URL compiles fine and fails at runtime on a user's machine as an
          # opaque "No API key found in request" — which is exactly how a stray /rest/v1/
          # suffix shipped once already. The client appends its own path, so the secret must
          # be the bare origin. Trailing whitespace survives a paste and is invisible.
          if ($url -ne $url.Trim()) {
            Write-Error "SUPABASE_URL has leading/trailing whitespace."; exit 1
          }
          if ($url -notmatch '^https://[a-z0-9]+\.supabase\.co$') {
            Write-Error "SUPABASE_URL must be exactly https://<project-ref>.supabase.co — no trailing slash, no /rest/v1, and .co not .com. Got: '$url'"
            exit 1
          }
          if ($key -ne $key.Trim() -or [string]::IsNullOrWhiteSpace($key)) {
            Write-Error "SUPABASE_KEY is empty or has leading/trailing whitespace."; exit 1
          }
          Write-Host "SUPABASE_URL shape OK: $url"

          @"
          namespace Hatch.Services;
          internal static class Secrets
          {
              public const string SupabaseUrl = "$url";
              public const string SupabaseKey = "$key";
          }
          "@ | Set-Content Services/Secrets.cs -Encoding utf8NoBOM

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Generate placeholder assets
        shell: pwsh
        run: .\scripts\create-assets.ps1

      - name: Set MSIX version from tag
        shell: pwsh
        run: |
          # On workflow_dispatch github.ref_name is a branch, which would pad out to a
          # nonsense MSIX version like "main.0.0.0".
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "${{ inputs.version }}"
          } else {
            "${{ github.ref_name }}"
          }
          $parts = $tag.TrimStart('v').Split('.')
          while ($parts.Count -lt 4) { $parts += '0' }
          $msixVer = ($parts[0..3]) -join '.'
          (Get-Content Package.appxmanifest -Raw) `
            -creplace 'Version="[\d\.]+"', "Version=""$msixVer""" |
            Set-Content Package.appxmanifest -Encoding utf8NoBOM
          "MSIX_VERSION=$msixVer" | Out-File $env:GITHUB_ENV -Append

      - name: Decode signing certificate
        shell: pwsh
        run: |
          $pfxBytes = [Convert]::FromBase64String("${{ secrets.SIGNING_CERTIFICATE }}")
          [IO.File]::WriteAllBytes("${{ github.workspace }}\signing.pfx", $pfxBytes)
          $cert = Import-PfxCertificate `
            -FilePath "${{ github.workspace }}\signing.pfx" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -Password (ConvertTo-SecureString "${{ secrets.CERTIFICATE_PASSWORD }}" -AsPlainText -Force)
          [IO.File]::WriteAllBytes(
            "${{ github.workspace }}\install-cert.cer",
            $cert.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert)
          )
          "CERT_THUMBPRINT=$($cert.Thumbprint)" | Out-File $env:GITHUB_ENV -Append
          Write-Host "Certificate thumbprint: $($cert.Thumbprint)"

      - name: Restore dependencies
        shell: pwsh
        run: |
          msbuild hatch.csproj /t:Restore /p:Configuration=Release /p:Platform=x64 /nowarn:NETSDK1233
          msbuild hatch.csproj /t:Restore /p:Configuration=Release /p:Platform=arm64 /nowarn:NETSDK1233

      - name: Build x64 MSIX
        shell: pwsh
        run: |
          msbuild hatch.csproj `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:AppxPackageDir="${{ github.workspace }}\AppxPackages\" `
            /p:AppxPackageSigningEnabled=true `
            /p:PackageCertificateThumbprint="${{ env.CERT_THUMBPRINT }}" `
            /nowarn:NETSDK1233
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build x86 MSIX
        continue-on-error: true
        shell: pwsh
        run: |
          msbuild hatch.csproj `
            /p:Configuration=Release `
            /p:Platform=x86 `
            /p:AppxPackageDir="${{ github.workspace }}\AppxPackages\" `
            /p:AppxPackageSigningEnabled=true `
            /p:PackageCertificateThumbprint="${{ env.CERT_THUMBPRINT }}" `
            /nowarn:NETSDK1233
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build arm64 MSIX
        shell: pwsh
        run: |
          msbuild hatch.csproj `
            /p:Configuration=Release `
            /p:Platform=arm64 `
            /p:AppxPackageDir="${{ github.workspace }}\AppxPackages\" `
            /p:AppxPackageSigningEnabled=true `
            /p:PackageCertificateThumbprint="${{ env.CERT_THUMBPRINT }}" `
            /nowarn:NETSDK1233
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Collect MSIX files and create bundle
        shell: pwsh
        run: |
          # Find the Windows SDK MakeAppx.exe
          $makeAppx = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" `
            -Filter "MakeAppx.exe" -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "x64" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $makeAppx) { Write-Error "MakeAppx.exe not found"; exit 1 }
          Write-Host "Using MakeAppx: $($makeAppx.FullName)"

          # Collect MSIX files (they live inside per-arch subdirectories)
          # Absolute: AppxPackageDir writes to the repo root, not the windows/ working dir.
          $msixFiles = Get-ChildItem -Recurse -Filter "*.msix" -Path "${{ github.workspace }}\AppxPackages" |
            Where-Object { $_.FullName -notmatch "\\Dependencies\\" }

          Write-Host "Found MSIX files:"
          $msixFiles | ForEach-Object { Write-Host "  $($_.FullName)" }

          if ($msixFiles.Count -eq 0) { Write-Error "No MSIX files found"; exit 1 }

          # Copy them flat into a staging folder so MakeAppx /d can find them
          $stagingDir = "${{ github.workspace }}\BundleStaging"
          New-Item -ItemType Directory -Path $stagingDir -Force | Out-Null
          $msixFiles | ForEach-Object { Copy-Item $_.FullName -Destination $stagingDir }

          # Create the bundle
          $bundleName = "Hatch_${{ env.MSIX_VERSION }}_bundle.msixbundle"
          $bundlePath = "${{ github.workspace }}\$bundleName"
          # /bv required: without it MakeAppx auto-generates a timestamp-based bundle
          # Identity Version, which then mismatches the Hatch.appinstaller MainBundle
          # Version below and breaks install/update with "Error in parsing the app package".
          & $makeAppx.FullName bundle /d $stagingDir /p $bundlePath /bv "${{ env.MSIX_VERSION }}" /overwrite
          if ($LASTEXITCODE -ne 0) { Write-Error "MakeAppx bundle failed"; exit $LASTEXITCODE }

          "BUNDLE_PATH=$bundlePath" | Out-File $env:GITHUB_ENV -Append
          "BUNDLE_NAME=$bundleName" | Out-File $env:GITHUB_ENV -Append
          Write-Host "Bundle created: $bundlePath"

      - name: Sign MSIX bundle
        shell: pwsh
        run: |
          $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" `
            -Filter "signtool.exe" -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "x64" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) { Write-Error "signtool.exe not found"; exit 1 }
          & $signtool.FullName sign `
            /fd sha256 `
            /sha1 "${{ env.CERT_THUMBPRINT }}" `
            "${{ env.BUNDLE_PATH }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Bundle signed successfully"

      - name: Generate App Installer file
        shell: pwsh
        run: |
          # The bundle is pinned to this tag rather than /releases/latest/download/,
          # so the URL in a given .appinstaller always resolves to the exact build it
          # was generated for, even after the next release ships.
          $bundleUrl = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ env.BUNDLE_NAME }}"
          $out = "${{ github.workspace }}\Hatch.appinstaller"
          (Get-Content Hatch.appinstaller.template -Raw) `
            -replace '\{VERSION\}', "${{ env.MSIX_VERSION }}" `
            -replace '\{BUNDLE_URL\}', $bundleUrl |
            Set-Content $out -Encoding utf8NoBOM
          "APPINSTALLER_PATH=$out" | Out-File $env:GITHUB_ENV -Append
          Write-Host "--- Hatch.appinstaller ---"
          Get-Content $out

      # Publishing to Pages is what actually makes updates reachable — the copy
      # attached to the release below is only for a first manual install.
      - name: Publish App Installer to GitHub Pages
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $pages = "${{ github.workspace }}\gh-pages"
          git clone --depth 1 --branch gh-pages `
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" $pages
          Copy-Item "${{ env.APPINSTALLER_PATH }}" "$pages\Hatch.appinstaller" -Force
          Push-Location $pages
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Hatch.appinstaller
          if (git status --porcelain) {
            git commit -m "chore: publish App Installer for ${{ github.ref_name }}"
            git push origin gh-pages
            Write-Host "Published to GitHub Pages"
          } else {
            Write-Host "No change to publish"
          }
          Pop-Location

      # Tag pushes only. A manual run is a dry run — it must never publish a release.
      - name: Create GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          name: Hatch ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## Install

            **[Get Hatch on the Microsoft Store](#)** — recommended, no setup required.

            Or install directly, and get future updates automatically:
            1. **First time only** — download `install-cert.cer`, double-click → Install Certificate → Local Machine → Trusted People → Finish
            2. Open **<https://fbtwitter.github.io/hatch/Hatch.appinstaller>** and choose Install

            Installing that way registers Hatch with Windows App Installer, which
            checks for new versions daily and updates in the background — no need to
            come back here for the next release.

            <details>
            <summary>One-off install without auto-updates</summary>

            Download `${{ env.BUNDLE_NAME }}` and double-click it — Windows picks the
            right architecture (x64, ARM64 or x86) automatically. Installs done this
            way will not update themselves.
            </details>

            ---
          files: |
            ${{ env.BUNDLE_PATH }}
            ${{ env.APPINSTALLER_PATH }}
            install-cert.cer
