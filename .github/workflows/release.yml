name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-and-release:
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Generate placeholder assets
        shell: pwsh
        run: .\scripts\create-assets.ps1

      - name: Create AppxPackages directory
        shell: pwsh
        run: |
          $dir = "${{ github.workspace }}\AppxPackages"
          if (!(Test-Path $dir)) {
            New-Item -ItemType Directory -Path $dir -Force | Out-Null
            Write-Host "Created AppxPackages directory: $dir"
          }

      - name: Set MSIX version from tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $parts = $tag.TrimStart('v').Split('.')
          while ($parts.Count -lt 4) { $parts += '0' }
          $msixVer = ($parts[0..3]) -join '.'
          (Get-Content Package.appxmanifest -Raw) `
            -creplace 'Version="[\d\.]+"', "Version=""$msixVer""" |
            Set-Content Package.appxmanifest -Encoding utf8NoBOM
          "MSIX_VERSION=$msixVer" | Out-File $env:GITHUB_ENV -Append

      - name: Decode signing certificate
        shell: pwsh
        run: |
          $pfxBytes = [Convert]::FromBase64String("${{ secrets.SIGNING_CERTIFICATE }}")
          [IO.File]::WriteAllBytes("signing.pfx", $pfxBytes)
          # Import into the current-user store so SignTool can reach the private key.
          $cert = Import-PfxCertificate `
            -FilePath "signing.pfx" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -Password (ConvertTo-SecureString "${{ secrets.CERTIFICATE_PASSWORD }}" -AsPlainText -Force)
          [IO.File]::WriteAllBytes("install-cert.cer",
            $cert.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert))
          "CERT_THUMBPRINT=$($cert.Thumbprint)" | Out-File $env:GITHUB_ENV -Append

      - name: Build x64 MSIX
        shell: pwsh
        run: |
          $result = msbuild todo-winui3.csproj `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:GenerateAppxPackageOnBuild=true `
            /p:AppxBundle=Never `
            /p:AppxPackageDir="${{ github.workspace }}\AppxPackages\" `
            /p:AppxPackageSigningEnabled=true `
            /p:PackageCertificateThumbprint="${{ env.CERT_THUMBPRINT }}" `
            /verbosity:detailed
          if ($LASTEXITCODE -ne 0) {
            Write-Host "x64 build failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }
          Write-Host "x64 build completed successfully"
          Get-ChildItem -Recurse -Path AppxPackages -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }

      - name: Build x86 MSIX
        shell: pwsh
        run: |
          $result = msbuild todo-winui3.csproj `
            /p:Configuration=Release `
            /p:Platform=x86 `
            /p:GenerateAppxPackageOnBuild=true `
            /p:AppxBundle=Never `
            /p:AppxPackageDir="${{ github.workspace }}\AppxPackages\" `
            /p:AppxPackageSigningEnabled=true `
            /p:PackageCertificateThumbprint="${{ env.CERT_THUMBPRINT }}" `
            /verbosity:detailed
          if ($LASTEXITCODE -ne 0) {
            Write-Host "x86 build failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }
          Write-Host "x86 build completed successfully"
          Get-ChildItem -Recurse -Path AppxPackages -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }

      - name: Build arm64 MSIX
        shell: pwsh
        run: |
          $result = msbuild todo-winui3.csproj `
            /p:Configuration=Release `
            /p:Platform=arm64 `
            /p:GenerateAppxPackageOnBuild=true `
            /p:AppxBundle=Never `
            /p:AppxPackageDir="${{ github.workspace }}\AppxPackages\" `
            /p:AppxPackageSigningEnabled=true `
            /p:PackageCertificateThumbprint="${{ env.CERT_THUMBPRINT }}" `
            /verbosity:detailed
          if ($LASTEXITCODE -ne 0) {
            Write-Host "arm64 build failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }
          Write-Host "arm64 build completed successfully"
          Get-ChildItem -Recurse -Path AppxPackages -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }

      - name: Debug - Check all files in workspace
        shell: pwsh
        run: |
          Write-Host "All MSIX files:"
          Get-ChildItem -Recurse -Filter "*.msix" -Path . -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }
          Write-Host "`nAppxPackages directory contents:"
          if (Test-Path AppxPackages) {
            Get-ChildItem -Recurse -Path AppxPackages | ForEach-Object { Write-Host $_.FullName }
          } else {
            Write-Host "AppxPackages directory does not exist"
          }

      - name: Setup Windows SDK
        shell: pwsh
        run: |
          $sdkPath = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin\*\x64" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($sdkPath) {
            $env:PATH = "$($sdkPath.FullName);$env:PATH"
            "PATH=$env:PATH" | Out-File $env:GITHUB_ENV -Append
          }

      - name: Create MSIX bundle
        shell: pwsh
        run: |
          if (!(Test-Path "AppxPackages")) {
            Write-Host "AppxPackages directory not found, skipping bundle creation"
            "BUNDLE_PATH=" | Out-File $env:GITHUB_ENV -Append
            "BUNDLE_NAME=" | Out-File $env:GITHUB_ENV -Append
            exit 0
          }

          $x64 = Get-ChildItem -Recurse -Filter "*_x64_*.msix" -Path AppxPackages | Select-Object -First 1
          $x86 = Get-ChildItem -Recurse -Filter "*_x86_*.msix" -Path AppxPackages | Select-Object -First 1
          $arm64 = Get-ChildItem -Recurse -Filter "*_arm64_*.msix" -Path AppxPackages | Select-Object -First 1
          $packages = @()
          if ($x64) { $packages += $x64.FullName }
          if ($x86) { $packages += $x86.FullName }
          if ($arm64) { $packages += $arm64.FullName }

          if ($packages.Count -eq 0) {
            Write-Host "No MSIX files found, skipping bundle creation"
            "BUNDLE_PATH=" | Out-File $env:GITHUB_ENV -Append
            "BUNDLE_NAME=" | Out-File $env:GITHUB_ENV -Append
            exit 0
          }

          $mappingFile = @"
          <?xml version="1.0" encoding="utf-8"?>
          <MsixBundleMetadata xmlns="http://schemas.microsoft.com/appx/msixbundle/2015/02">
            <Packages>
          "@
          foreach ($pkg in $packages) {
            if (Test-Path $pkg) {
              $name = Split-Path $pkg -Leaf
              $mappingFile += "`n      <Package FileName=""$name"" />"
            }
          }
          $mappingFile += "`n    </Packages>`n  </MsixBundleMetadata>"
          $mappingFile | Out-File "mapping.xml" -Encoding utf8NoBOM

          $bundleName = "Hatch_${{ env.MSIX_VERSION }}_bundle.msixbundle"
          MakeAppx.exe bundle /d "AppxPackages" /p $bundleName /mf mapping.xml
          "BUNDLE_PATH=$(Get-Item $bundleName | Select-Object -ExpandProperty FullName)" | Out-File $env:GITHUB_ENV -Append
          "BUNDLE_NAME=$bundleName" | Out-File $env:GITHUB_ENV -Append

      - name: Locate MSIX packages
        shell: pwsh
        run: |
          $x64 = Get-ChildItem -Recurse -Filter "*_x64_*.msix" -Path AppxPackages -ErrorAction SilentlyContinue | Select-Object -First 1
          $x86 = Get-ChildItem -Recurse -Filter "*_x86_*.msix" -Path AppxPackages -ErrorAction SilentlyContinue | Select-Object -First 1
          $arm64 = Get-ChildItem -Recurse -Filter "*_arm64_*.msix" -Path AppxPackages -ErrorAction SilentlyContinue | Select-Object -First 1

          "X64_MSIX_PATH=$($x64?.FullName ?? '')" | Out-File $env:GITHUB_ENV -Append
          "X64_MSIX_NAME=$($x64?.Name ?? '')" | Out-File $env:GITHUB_ENV -Append
          "X86_MSIX_PATH=$($x86?.FullName ?? '')" | Out-File $env:GITHUB_ENV -Append
          "X86_MSIX_NAME=$($x86?.Name ?? '')" | Out-File $env:GITHUB_ENV -Append
          "ARM64_MSIX_PATH=$($arm64?.FullName ?? '')" | Out-File $env:GITHUB_ENV -Append
          "ARM64_MSIX_NAME=$($arm64?.Name ?? '')" | Out-File $env:GITHUB_ENV -Append

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Hatch ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## Installation

            **First time only — install the signing certificate so Windows trusts the package:**
            1. Download `install-cert.cer`
            2. Double-click it → **Install Certificate** → **Local Machine** → **Trusted People** → Finish

            **Install / update the app:**
            ${{ env.BUNDLE_NAME != '' && format('- **Recommended:** Download `{0}` for automatic architecture detection', env.BUNDLE_NAME) || '- Bundle not available' }}
            - **Or choose your platform:**
              ${{ env.X64_MSIX_NAME != '' && format('- **Intel/AMD 64-bit:** `{0}`', env.X64_MSIX_NAME) || '- **Intel/AMD 64-bit:** Not available' }}
              ${{ env.X86_MSIX_NAME != '' && format('- **Intel/AMD 32-bit:** `{0}`', env.X86_MSIX_NAME) || '- **Intel/AMD 32-bit:** Not available' }}
              ${{ env.ARM64_MSIX_NAME != '' && format('- **ARM 64-bit:** `{0}`', env.ARM64_MSIX_NAME) || '- **ARM 64-bit:** Not available' }}
            - Double-click the file to install

            > Subsequent releases from this repo won't need the certificate step again.
          files: |
            ${{ env.BUNDLE_PATH }}
            ${{ env.X64_MSIX_PATH }}
            ${{ env.X86_MSIX_PATH }}
            ${{ env.ARM64_MSIX_PATH }}
            install-cert.cer
