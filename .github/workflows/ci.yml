name: CI

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * 1'
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-2022
    timeout-minutes: 35

    # The WinUI app lives in windows/; every step below keeps its original relative paths.
    defaults:
      run:
        working-directory: windows

    steps:
      - uses: actions/checkout@v4

      # Secrets.cs is gitignored (windows/Services/Secrets.cs) — CI builds don't need real
      # Supabase access, just something for the compiler to reference.
      - name: Write dummy Secrets.cs
        shell: pwsh
        run: |
          @"
          namespace Hatch.Services;
          internal static class Secrets
          {
              public const string SupabaseUrl = "https://ci-placeholder.invalid/";
              public const string SupabaseKey = "ci-placeholder";
          }
          "@ | Set-Content Services/Secrets.cs -Encoding utf8NoBOM

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Generate placeholder assets
        shell: pwsh
        run: .\scripts\create-assets.ps1

      - name: Build (Debug, x64)
        shell: pwsh
        run: |
          msbuild hatch.csproj /t:Restore /p:Configuration=Debug /p:Platform=x64 /nowarn:NETSDK1233
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          msbuild hatch.csproj /p:Configuration=Debug /p:Platform=x64 /nowarn:NETSDK1233
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run full regression scan
        shell: pwsh
        run: .\scripts\run-regression.ps1 -SkipBuild -ArtifactRoot "$env:RUNNER_TEMP\Hatch.Regression"

      - name: Upload regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hatch-regression
          path: ${{ runner.temp }}/Hatch.Regression
          if-no-files-found: warn
          retention-days: 7
